# Reference copy of the fdroiddata recipe (metadata/com.openvolley.beach.yml),
# adapted from OpenVolley's (android/fdroid/com.openvolley.escoresheet.yml).
# AllowedAPKSigningKeys is the SHA-256 of the OpenBeach signing certificate
# (~/.config/openbeach-android/cert.sha256; never OpenVolley's 2c7f9db4…).
# Check a signed APK against it:
#   apksigner verify --print-certs <signed apk> | grep SHA-256
# The owner-signed APK must be on the GitHub release android-v<versionName>
# as com.openvolley.beach_<versionCode>.apk (Binaries below), so F-Droid can
# check its own build against it byte for byte (ANDROID.md).
Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Luca Canepa
WebSite: https://beach.openvolley.app
SourceCode: https://github.com/Lucanepa/openbeach
IssueTracker: https://github.com/Lucanepa/openbeach/issues

AutoName: OpenBeach

RepoType: git
Repo: https://github.com/Lucanepa/openbeach.git
Binaries: 
  https://github.com/Lucanepa/openbeach/releases/download/android-v%v/com.openvolley.beach_%c.apk

Builds:
  - versionName: 2.0.0
    versionCode: 20000000
    commit: 16de62e126de6080fed99ac7a41c1f9cace8c58c
    subdir: escoresheet/frontend/android/app
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de node.tar.xz"
        | sha256sum -c -
      - tar xJf node.tar.xz --strip-components=1 -C /usr/local/
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      - cd ../..
      - CAPACITOR=true VITE_BACKEND_URL=https://backend.openvolley.app npx vite build
        --outDir dist-capacitor --emptyOutDir
      - npx cap sync android
    scanignore:
      - escoresheet/frontend/node_modules/pdfjs-dist/iccs
    scandelete:
      - escoresheet/frontend/node_modules

AllowedAPKSigningKeys: 9faf8e1947e491a769a6da717afaa553c44de6fa9576dbceee19f099dae1deae

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android-v[\d.]+$
CurrentVersion: 2.0.0
CurrentVersionCode: 20000000
