# Update proposals as pull requests, reviewed like any other change: the npm
# lock file of the frontend and the Android build (Gradle). The repository
# has no workflows, so there are no actions to pin.
# Security updates come as soon as an advisory is published; the rest weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /escoresheet/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /escoresheet/frontend/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
