name: Dependency audit

# Published advisories in what ships (audit SEC-50, as OpenVolley's
# dependency-audit.yml): npm audit of the frontend's production dependencies
# (high and critical fail the job). On every pull request, and weekly, so an
# advisory published for an unchanged lock file shows up too. Dependabot
# (.github/dependabot.yml) proposes the updates. Reads the lock file only:
# nothing is installed or built.
on:
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: npm audit (production dependencies)
        working-directory: escoresheet/frontend
        run: npm audit --omit=dev --audit-level=high
